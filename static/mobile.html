<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171717">
<title>IFP Repair Photos</title>
<link rel="icon" href="/assets/ifp_logo_app.png">
<link rel="apple-touch-icon" href="/assets/ifp_logo_app.png">
<link rel="stylesheet" href="/static/style.css">
<style>
  body { font-size: 16px; }
  .m-wrap { max-width: 560px; margin: 0 auto; padding: 14px 14px 60px; }
  .m-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .m-head img { height: 44px; }
  .m-head h1 { font-size: 20px; margin: 0; }
  .m-head .subtitle { font-size: 12px; }
  .m-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .m-field input { font-size: 20px; padding: 12px 14px; text-transform: uppercase; }
  .m-field select { font-size: 17px; padding: 11px 14px; }
  .m-field select:invalid, .m-field select option[value=""] { color: var(--muted); }
  .m-status { min-height: 20px; font-size: 13px; }
  .m-status b { color: var(--cyan); }
  .m-status .muted { font-size: 12px; word-break: break-all; }
  .m-status .err { color: #ff8a8a; }
  .m-queue { font-size: 13px; margin: -4px 0 12px; }
  .m-queue .err { color: #ff8a8a; }
  .m-queue .link-btn { background: transparent; border: 0; color: var(--orange); font: inherit; font-weight: bold; text-decoration: underline; cursor: pointer; }
  .m-whoami { font-size: 13px; margin: -6px 0 12px; }
  .m-whoami b { color: var(--cyan); }
  .m-whoami a { color: var(--orange); }
  .m-status .link-btn { background: transparent; border: 0; color: var(--orange); font: inherit; font-weight: bold; text-decoration: underline; cursor: pointer; padding: 0 2px; }
  .m-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .m-actions .btn { padding: 18px 10px; font-size: 17px; font-weight: bold; border-radius: 10px; }
  .m-actions .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .m-progress { height: 6px; background: #333; border-radius: 3px; overflow: hidden; margin-bottom: 12px; }
  .m-progress div { height: 100%; width: 0; background: var(--orange); transition: width 0.2s; }
  .m-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .m-grid figure { margin: 0; position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: #111; border: 1px solid #444; }
  .m-grid img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .m-grid figcaption { position: absolute; left: 0; right: 0; bottom: 0; font-size: 10px; padding: 3px 5px; background: rgba(0,0,0,0.6); color: #ddd; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .m-grid .used { position: absolute; top: 4px; left: 4px; background: var(--section); color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 8px; }
  .m-grid .rm { position: absolute; top: 4px; right: 4px; background: rgba(0,0,0,0.65); border: 0; color: #fff; border-radius: 50%; width: 26px; height: 26px; font-size: 14px; cursor: pointer; }
  .m-recent { margin-top: 18px; }
  .m-recent h3 { font-size: 13px; color: var(--muted); margin: 0 0 6px; font-weight: normal; }
  .m-recent button { background: #2c2c2c; border: 1px solid var(--border); color: var(--text); border-radius: 16px; padding: 6px 12px; margin: 0 6px 6px 0; cursor: pointer; }
  .m-recent button b { color: var(--cyan); }
  .m-empty { color: var(--muted); text-align: center; padding: 30px 10px; }
</style>
</head>
<body>
<div class="m-wrap">
  <div class="m-head">
    <img src="/assets/ifp_logo_app.png" alt="IFP">
    <div>
      <h1>Repair Photos</h1>
      <div class="subtitle">Photos go to the repair's library for the evaluation report</div>
    </div>
  </div>

  <div class="m-whoami muted" id="whoami" hidden></div>

  <label class="m-field">
    <span>Who are you?</span>
    <select id="tech"><option value="">— pick your name —</option></select>
  </label>

  <label class="m-field">
    <span>Repair #</span>
    <input type="text" id="repair" placeholder="R123456" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="done">
    <div class="m-status" id="status"></div>
  </label>

  <div class="m-actions">
    <button class="btn primary" id="btn-camera" disabled>📷 Take Photo</button>
    <button class="btn" id="btn-gallery" disabled>🖼 Choose Photos</button>
    <input type="file" id="cam" accept="image/*" capture="environment" hidden>
    <input type="file" id="gal" accept="image/*" multiple hidden>
  </div>
  <div class="m-progress" id="progress" hidden><div id="bar"></div></div>
  <div class="m-queue" id="queue" hidden></div>

  <div class="m-grid" id="grid"></div>
  <div class="m-empty" id="empty" hidden>No photos yet for this repair.</div>

  <div class="m-recent" id="recent" hidden>
    <h3>Recent repairs</h3>
    <div id="recent-list"></div>
  </div>
</div>
<div id="toast" class="toast" hidden></div>
<script src="/static/mobile.js"></script>
</body>
</html>
